name: pages

on:
  push:
    branches: [main]
    paths:
      - "lab/**"
      - "site/**"
      - "CHANGELOG.md"
      - "src/**"
      - "blits.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than canceling it; a half-applied Pages deploy is worse
# than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BLINKEN_SITE_BASE: /blinken/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci --prefix site
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm --prefix site run typecheck
      - uses: actions/configure-pages@v6
      # The docs site, with the lab's pages built into it at the URLs they had before.
      - run: npm run site:smoke
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
